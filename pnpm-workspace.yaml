# Supply Chain Hardening:
# - minimumReleaseAge: only install package versions published at least this many
#   minutes ago (4320 = 3 days), providing a rolling publish-recency cooldown.
# - onlyBuiltDependencies: allowlist of packages permitted to run install/build
#   lifecycle scripts (pnpm 10 blocks all by default).
minimumReleaseAge: 4320
onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - keccak
  - secp256k1
# Settings below moved from package.json's "pnpm" field, which pnpm 10 no longer reads.
overrides:
  '@types/react': 17.0.2
  '@types/react-dom': 17.0.2
  # Security patches for transitive deps pinned by next@12 and next-mdx-remote@3 (MDX 1).
  '@babel/core@<7.29.6': ^7.29.6
  'esbuild@<0.25.0': ^0.25.0
  'postcss@<8.5.23': ^8.5.23
  'trim@<0.0.3': ^0.0.3
  # @ethereumjs 10.1.2 removed EOF support, which the EOF fork view relies on.
  '@ethereumjs/binarytree': 10.1.0
  '@ethereumjs/block': 10.1.0
  '@ethereumjs/common': 10.1.0
  '@ethereumjs/evm': 10.1.0
  '@ethereumjs/mpt': 10.1.0
  '@ethereumjs/rlp': 10.1.0
  '@ethereumjs/statemanager': 10.1.0
  '@ethereumjs/tx': 10.1.0
  '@ethereumjs/util': 10.1.0
  '@ethereumjs/vm': 10.1.0
allowedDeprecatedVersions:
  '@babel/plugin-proposal-object-rest-spread': 7.12.1
  core-js: 2.6.12
  trim: 0.0.3
